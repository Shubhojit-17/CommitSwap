[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
    "v4-core/=lib/v4-core/src/",
    "@uniswap/v4-core/=lib/v4-core/",
    "solmate/=lib/v4-core/lib/solmate/",
    "forge-std/=lib/forge-std/src/"
]
